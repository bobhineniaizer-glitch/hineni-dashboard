<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 1080px; height: 1080px; font-family: 'Helvetica Neue', Arial, sans-serif; }
.card {
    width: 1080px; height: 1080px;
    background: linear-gradient(135deg, #1a0000 0%, #4a0000 40%, #8b0000 100%);
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    padding: 80px; text-align: center; position: relative;
}
.badge { background: #FFD700; color: #000; font-size: 20px; font-weight: 800; padding: 10px 30px; border-radius: 30px; letter-spacing: 3px; margin-bottom: 40px; }
.title { color: #fff; font-size: 64px; font-weight: 800; margin-bottom: 20px; text-transform: uppercase; }
.movie { color: #FFD700; font-size: 42px; font-weight: 300; font-style: italic; margin-bottom: 40px; }
.prize { color: #fff; font-size: 80px; font-weight: 900; margin-bottom: 20px; text-shadow: 0 0 30px rgba(255,215,0,0.5); }
.details { color: #ccc; font-size: 28px; line-height: 1.6; margin-bottom: 50px; }
.cta { background: #FFD700; color: #000; font-size: 24px; font-weight: 800; padding: 20px 50px; border-radius: 50px; }
.url { color: #888; font-size: 20px; margin-top: 30px; }
</style></head><body>
<div class="card">
    <div class="badge">FREE ENTRY</div>
    <div class="title">Discover Me</div>
    <div class="movie">American Psycho</div>
    <div class="prize">$1,000</div>
    <div class="details">Perform. Get Voted. Win.<br>6 days left to submit.</div>
    <div class="cta">ENTER NOW</div>
    <div class="url">beta.hineni.com/discover-me</div>
</div>
</body></html>

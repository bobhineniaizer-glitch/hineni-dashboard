<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 1080px; height: 1080px; font-family: 'Helvetica Neue', Arial, sans-serif; }
.card {
    width: 1080px; height: 1080px;
    background: linear-gradient(180deg, #0d0d0d 0%, #1a1a1a 100%);
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    padding: 80px; text-align: center;
}
.emoji { font-size: 80px; margin-bottom: 30px; }
.question { color: #fff; font-size: 48px; font-weight: 700; margin-bottom: 50px; line-height: 1.3; }
.old-way { margin-bottom: 40px; }
.old-way .label { color: #e3342f; font-size: 24px; font-weight: 600; margin-bottom: 15px; letter-spacing: 3px; }
.old-way .items { color: #888; font-size: 26px; line-height: 2; }
.old-way .items .strike { text-decoration: line-through; }
.new-way { margin-bottom: 40px; }
.new-way .label { color: #38c172; font-size: 24px; font-weight: 600; margin-bottom: 15px; letter-spacing: 3px; }
.new-way .items { color: #fff; font-size: 26px; line-height: 2; }
.logo { color: #FFD700; font-size: 32px; font-weight: 800; letter-spacing: 4px; margin-top: 30px; }
</style></head><body>
<div class="card">
    <div class="emoji">👻</div>
    <div class="question">Tired of never<br>hearing back?</div>
    <div class="old-way">
        <div class="label">THE OLD WAY</div>
        <div class="items">
            <span class="strike">Submit and pray</span><br>
            <span class="strike">Dead listings everywhere</span><br>
            <span class="strike">Radio silence for weeks</span>
        </div>
    </div>
    <div class="new-way">
        <div class="label">THE HINENI WAY</div>
        <div class="items">
            ✅ Clear accept/reject notifications<br>
            ✅ Only live, time-bound auditions<br>
            ✅ Know where you stand. Always.
        </div>
    </div>
    <div class="logo">HINENI</div>
</div>
</body></html>
